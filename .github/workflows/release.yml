name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this to use for Nuget publishing

    steps:
    - uses: actions/checkout@v6

    - name: Get version
      # Extract the version from the release tag.
      run: |
        TAG_NAME=$GITHUB_REF_NAME
        VERSION=$(echo $TAG_NAME | sed -r 's/^v?([0-9.]+)$/\1/')
        echo "Version=$VERSION" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Pack
      run: dotnet pack -c Release --no-restore -o .

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }} # Nuget Org

    - name: Publish Nuget packages
      run: |
        dotnet nuget push *.nupkg \
          -s https://api.nuget.org/v3/index.json \
          --skip-duplicate \
          --no-symbols \
          --api-key ${{steps.login.outputs.NUGET_API_KEY}}
